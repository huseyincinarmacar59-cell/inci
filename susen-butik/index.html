<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Susen Butik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--plum:#7a4a63;--plum2:#5e3449;--cream:#fff8f0;--rose:#f3b6b0;--ink:#4a3340;--gold:#d9a95b;--mint:#7fbf9f;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#f3e3d3;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui button{font-family:inherit;pointer-events:auto;touch-action:manipulation;cursor:pointer}
#hud{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 10px);right:calc(env(safe-area-inset-right) + 10px);display:flex;gap:8px;align-items:center;flex-wrap:wrap;transition:opacity .3s}
.chip{background:rgba(255,248,240,.92);border-radius:999px;padding:6px 12px;font-weight:600;font-size:15px;box-shadow:0 2px 8px rgba(90,50,60,.15);display:flex;align-items:center;gap:6px;white-space:nowrap}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a3,#e0a93a 70%);border:2px solid #c48a22;display:inline-block}
.bar{width:70px;height:10px;border-radius:6px;background:#ead8cc;overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--mint);border-radius:6px;transition:width .3s,background .3s}
#custCard{position:absolute;top:calc(env(safe-area-inset-top) + 52px);left:calc(env(safe-area-inset-left) + 10px);background:rgba(255,248,240,.92);border-radius:14px;padding:6px 12px;font-weight:600;font-size:14px;box-shadow:0 2px 8px rgba(90,50,60,.15);display:none;align-items:center;gap:8px}
#custCard .bar{width:110px;height:12px}
#viewTitle{position:absolute;top:calc(env(safe-area-inset-top) + 92px);left:0;right:0;text-align:center;font-weight:600;font-size:15px;color:var(--plum2);text-shadow:0 1px 0 #fff8f0;display:none}
#viewTitle span{background:rgba(255,248,240,.85);padding:4px 14px;border-radius:999px}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 128px);transform:translate(-50%,-10px);background:var(--plum);color:#fff;padding:8px 16px;border-radius:999px;font-weight:500;font-size:15px;opacity:0;transition:all .25s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
#dialog{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);width:min(620px,94vw);background:var(--cream);border-radius:22px;padding:22px 20px 16px;box-shadow:0 8px 30px rgba(80,40,60,.28);border:3px solid #f0d9c8;pointer-events:auto;display:none}
#dialog .name{position:absolute;top:-16px;left:18px;background:var(--plum);color:#fff;font-weight:600;padding:5px 14px;border-radius:999px;font-size:15px}
#dialog .text{font-size:18px;line-height:1.45;min-height:52px}
#dialog .extra{margin-top:10px}
#dialog .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.btn{border:none;border-radius:999px;padding:11px 20px;font-size:16px;font-weight:600;background:#efe0d4;color:var(--ink);box-shadow:0 3px 0 #d9c3b3}
.btn.primary{background:var(--plum);color:#fff;box-shadow:0 3px 0 var(--plum2)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45}
body.working #dialog{bottom:calc(env(safe-area-inset-bottom) + 128px)}
#nav{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);display:none;flex-direction:column;align-items:center;gap:8px;width:min(640px,96vw)}
#nav .row{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;width:100%}
#nav .row .btn{flex:1;padding:10px 4px;font-size:14px;min-width:0}
#nav .btn.on{background:#f6c8b8;box-shadow:0 3px 0 #dba592}
#deliver{padding:12px 34px;font-size:17px}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:none;background:rgba(255,248,240,.9);box-shadow:0 3px 10px rgba(80,40,60,.25);display:none;align-items:center;justify-content:center}
.arrow.left{left:calc(env(safe-area-inset-left) + 10px)}
.arrow.right{right:calc(env(safe-area-inset-right) + 10px)}
.arrow svg{width:26px;height:26px}
#pipFrame{position:absolute;display:none;border:7px solid var(--gold);border-radius:50% / 42%;box-shadow:0 0 0 3px #b8843a inset,0 6px 18px rgba(80,40,60,.3);pointer-events:none}
#pipFrame span{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);background:rgba(255,248,240,.92);font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
#fade{position:absolute;inset:0;background:#2b1d25;opacity:0;transition:opacity .3s}
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(60,32,46,.45);pointer-events:auto;padding:20px}
.card{background:var(--cream);border-radius:28px;padding:28px 24px;width:min(460px,100%);max-height:92vh;overflow:auto;box-shadow:0 14px 40px rgba(40,20,30,.4);text-align:center;border:4px solid #f0d9c8}
.card h1{font-size:44px;margin:0;color:var(--plum);letter-spacing:.5px}
.card h2{font-size:28px;margin:0 0 6px;color:var(--plum)}
.card p{margin:8px 0;line-height:1.45}
.card .sub{font-size:16px;color:#8a6475;margin-bottom:14px}
.card .how{text-align:left;background:#f7ebe1;border-radius:16px;padding:12px 16px;font-size:15px;margin:14px 0}
.card .how div{margin:4px 0}
.card .btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.stats{display:flex;justify-content:space-around;margin:12px 0;background:#f7ebe1;border-radius:16px;padding:10px}
.stats b{display:block;font-size:22px;color:var(--plum)}
.stats small{font-size:13px;color:#8a6475}
.up{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;border:2px solid #f0e0d4}
.up .t{flex:1}
.up .t b{display:block;font-size:16px}
.up .t small{color:#8a6475;font-size:13px}
.up .btn{padding:8px 14px;font-size:14px}
.res{font-size:15px;background:#f7ebe1;border-radius:14px;padding:8px 12px}
.res .money{font-size:20px;font-weight:700;color:var(--plum)}
.res .wrong{color:#b04a4a;font-size:14px;margin-top:4px}
.stars{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.stars svg{width:18px;height:18px}
@media (max-height:500px){
 #dialog{padding:16px 16px 10px;bottom:calc(env(safe-area-inset-bottom) + 8px)}
 #dialog .text{font-size:16px;min-height:0}
 #viewTitle{top:calc(env(safe-area-inset-top) + 50px);text-align:right;padding-right:14px}
 #custCard{top:calc(env(safe-area-inset-top) + 50px)}
 #toast{top:calc(env(safe-area-inset-top) + 88px)}
 .card h1{font-size:34px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud" style="opacity:0">
    <div class="chip" id="hDay">Gün 1</div>
    <div class="chip"><span class="coin"></span><b id="hMoney">0</b> ₺</div>
    <div class="chip">İtibar <div class="bar"><i id="hRep"></i></div></div>
  </div>
  <div id="custCard"><span id="cName">Müşteri</span><span style="font-weight:500;font-size:13px;color:#8a6475">Sabır</span><div class="bar"><i id="hPat"></i></div></div>
  <div id="viewTitle"><span id="vtText"></span></div>
  <div id="toast"></div>
  <div id="pipFrame"><span>Ayna · dokun: isteği tekrar sor</span></div>
  <button class="arrow left" id="arL"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="#7a4a63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="arrow right" id="arR"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" fill="none" stroke="#7a4a63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div id="nav">
    <button class="btn primary" id="deliver">Hazır, kasaya geçelim</button>
    <div class="row">
      <button class="btn" data-v="over">Oda</button>
      <button class="btn" data-v="wardA">Dolap</button>
      <button class="btn" data-v="shoes">Ayakkabı</button>
      <button class="btn" data-v="hair">Kuaför</button>
      <button class="btn" data-v="makeup">Makyaj</button>
    </div>
  </div>
  <div id="dialog"><div class="name" id="dName"></div><div class="text" id="dText"></div><div class="extra" id="dExtra"></div><div class="btns" id="dBtns"></div></div>
  <div id="fade"></div>
  <div class="screen" id="overlay"><div class="card" id="card"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const V3=THREE.Vector3;
const R=Math.random, pick=a=>a[Math.floor(R()*a.length)], keys=Object.keys;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const cap=s=>s.charAt(0).toLocaleUpperCase('tr')+s.slice(1);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------------- DATA ---------------- */
const CLOTH={kirmizi:['kırmızı','#d9534f'],mavi:['mavi','#4a78d6'],siyah:['siyah','#2f2c33'],beyaz:['beyaz','#f6f2ea'],pembe:['pembe','#f29bbf'],yesil:['yeşil','#55a874']};
const HAIRC={siyah:['siyah','#221c1c'],kahve:['kahverengi','#6b4226'],sari:['sarı','#e8c35a'],kizil:['kızıl','#c4502a'],pembe:['pembe','#f08cba'],mor:['mor','#8b5cc4']};
const LIPC={kirmizi:['kırmızı','#c8102e'],pembe:['pembe','#e85d9b'],mor:['mor','#7b2d8e'],nude:['nude','#c98b7a'],turuncu:['turuncu','#ee7a2f']};
const EYEC={mavi:['mavi','#4f8fe0'],mor:['mor','#9a5bd1'],altin:['altın','#d9b04c'],kahve:['kahverengi','#8a5a3b'],yesil:['yeşil','#4fae7a']};
const TOPS={tisort:'tişört',gomlek:'gömlek',kazak:'kazak'};
const BOTS={etek:'etek',pantolon:'pantolon',sort:'şort'};
const DRESS={kisa:'kısa elbise',uzun:'uzun elbise'};
const SHOES={spor:'spor ayakkabı',topuklu:'topuklu ayakkabı',bot:'bot'};
const HAIRS={duz:'uzun düz',topuz:'topuz',atkuyrugu:'at kuyruğu',kisa:'kısa küt',orgu:'örgü'};
const SKINS=['#f6d7c3','#eec1a2','#d9a27e','#b97a57','#8d5a3c','#f3cfb3'];
const NAMES=['Ayşe','Elif','Zeynep','Merve','Selin','Ece','Defne','Buse','Gizem','İrem','Damla','Sude','Nehir','Yağmur','Melis','Ceren','Aslı','Derya','Pınar','Tuğba','Esra','Gül','Nazlı','Berra','Hande','Şule','Ebru','Nur'];
const GREET=['Merhaba!','Merhabalar!','İyi günler!','Selam!','Merhaba, kolay gelsin!'];
const OCC=['Akşam bir davetim var.','İş görüşmesine gidiyorum.','Bu akşam yemeğe çıkacağım.','Bir düğüne davetliyim.','Arkadaşlarla konsere gidiyoruz.','Bugün doğum günüm!','Fotoğraf çekimim var.','Nişanım var, çok heyecanlıyım.','Mezuniyet törenim var.','Kuzenimin kınasına gideceğim.'];
const UPS=[
 {id:'koltuk',name:'Rahat koltuk',desc:'Müşteriler %15 daha sabırlı',price:180},
 {id:'cicek',name:'Çiçek ve dekor',desc:'Bahşişler %25 artar',price:220},
 {id:'muzik',name:'Müzik sistemi',desc:'Müşteriler %15 daha sabırlı',price:260},
 {id:'kahve',name:'Kahve makinesi',desc:'Kasada kahve ikram et, sabır dolsun',price:320},
 {id:'isik',name:'Vitrin ışıkları',desc:'Tüm ödemeler %15 artar',price:400}
];

/* ---------------- SAVE ---------------- */
let G=null;
function freshG(){return {day:1,money:0,rep:50,up:{}};}
function load(){try{const s=JSON.parse(localStorage.getItem('susenButik1'));if(s&&s.day)return s;}catch(e){}return null;}
function save(){try{localStorage.setItem('susenButik1',JSON.stringify(G));}catch(e){}}

/* ---------------- AUDIO ---------------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function beep(f,d,type,v,slide){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,a.currentTime+d);g.gain.setValueAtTime(v||.06,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+.02);}catch(e){}}
const sfx={
 tap:()=>beep(720,.06,'triangle',.05),
 cloth:()=>{beep(420,.09,'sine',.05,1.8);setTimeout(()=>beep(640,.08,'sine',.04,1.4),60);},
 coin:()=>{beep(1180,.08,'square',.035);setTimeout(()=>beep(1580,.16,'square',.035),90);},
 bad:()=>beep(240,.35,'sawtooth',.035,.5),
 bell:()=>{beep(1320,.35,'sine',.06);setTimeout(()=>beep(990,.5,'sine',.05),140);},
 blip:()=>beep(520+R()*120,.03,'triangle',.018)
};

/* ---------------- RENDERER ---------------- */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#f3e3d3');
const camera=new THREE.PerspectiveCamera(40,1,.05,200);
const pipCam=new THREE.PerspectiveCamera(30,.75,.05,60);
const hemi=new THREE.HemisphereLight('#fff7ef','#b89580',.62);scene.add(hemi);
const sun=new THREE.DirectionalLight('#fff1e0',.62);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);const sc=sun.shadow.camera;sc.left=-8;sc.right=8;sc.top=8;sc.bottom=-8;sc.near=.5;sc.far=30;sun.shadow.bias=-.0006;sun.shadow.normalBias=.02;
scene.add(sun);scene.add(sun.target);
const amb=new THREE.AmbientLight('#ffffff',.1);scene.add(amb);

/* ---------------- HELPERS ---------------- */
const matCache={};
function mat(c,r){r=r==null?.8:r;const k=c+'_'+r;return matCache[k]||(matCache[k]=new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:0}));}
function shade(hex,amt){const c=new THREE.Color(hex);c.offsetHSL(0,0,amt);return '#'+c.getHexString();}
function mesh(geo,m,x,y,z,p){const o=new THREE.Mesh(geo,typeof m==='string'?mat(m):m);o.position.set(x||0,y||0,z||0);o.castShadow=true;o.receiveShadow=true;(p||scene).add(o);return o;}
function box(w,h,d,c,x,y,z,p){return mesh(new THREE.BoxGeometry(w,h,d),c,x,y,z,p);}
function cyl(rt,rb,h,c,x,y,z,p,seg){return mesh(new THREE.CylinderGeometry(rt,rb,h,seg||22),c,x,y,z,p);}
function sph(r,c,x,y,z,p,ws,hs){return mesh(new THREE.SphereGeometry(r,ws||20,hs||14),c,x,y,z,p);}
const hitMat=new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false});
function hit(w,h,d,x,y,z,p){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),hitMat);o.position.set(x,y,z);p.add(o);return o;}
function plane(w,h,c,x,y,z,ry,p,r){const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),typeof c==='string'?mat(c,r==null?.95:r):c);o.position.set(x,y,z);o.rotation.y=ry||0;o.receiveShadow=true;(p||scene).add(o);return o;}
function emis(c,i){return new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:i==null?.8:i,roughness:.5});}
function woodTex(a,b,rep){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');for(let i=0;i<8;i++){x.fillStyle=i%2?a:b;x.fillRect(0,i*64,512,64);x.fillStyle='rgba(60,30,10,.10)';x.fillRect(0,i*64,512,3);const off=(i*173)%512;x.fillRect(off,i*64,3,64);x.fillRect((off+256)%512,i*64,3,64);for(let k=0;k<6;k++){x.fillStyle='rgba(80,40,10,.05)';x.fillRect(R()*512,i*64+8+R()*48,40+R()*80,2);}}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep||3,rep||3);return t;}
function disposeTree(o){o.traverse(n=>{if(n.geometry)n.geometry.dispose();});}

/* ---------------- TWEENS ---------------- */
const tweens=[];
function tween(dur,fn,done){const t={t:0,dur,fn,done,dead:false};tweens.push(t);return t;}
function updTweens(dt){for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];if(t.dead){tweens.splice(i,1);continue;}t.t+=dt;const k=Math.min(1,t.t/t.dur);t.fn(k);if(k>=1){tweens.splice(i,1);t.done&&t.done();}}}
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

/* ---------------- GARMENTS ---------------- */
function buildTop(type,col){const g=new THREE.Group(),c=CLOTH[col][1],th=type==='kazak'?.014:0;
 cyl(.185+th,.215+th,.52,c,0,.96,0,g);const sh=sph(.188+th,c,0,1.2,0,g);sh.scale.y=.42;
 for(const s of[-1,1]){if(type==='tisort'){const sl=cyl(.068,.064,.19,c,s*.236,1.125,0,g);sl.rotation.z=s*.12;}
  else{const sl=cyl(.062+th,.057+th,.5,c,s*.255,.97,0,g);sl.rotation.z=s*.12;cyl(.06+th,.06+th,.04,shade(c,-.07),s*.284,.735,0,g).rotation.z=s*.12;}}
 if(type==='gomlek'){for(const s of[-1,1]){const k=box(.1,.05,.02,shade(c,.1),s*.05,1.235,.155,g);k.rotation.z=s*.5;k.rotation.x=-.5;}
  for(let i=0;i<4;i++)sph(.013,shade(c,c==='#f6f2ea'?-.25:.22),0,1.13-i*.11,.2,g,8,6);}
 if(type==='kazak'){cyl(.075,.082,.12,c,0,1.27,0,g);cyl(.232,.232,.05,shade(c,-.07),0,.725,0,g);}
 if(type==='tisort'){cyl(.218,.218,.025,shade(c,-.05),0,.71,0,g);}
 return g;}
function buildUnder(){const g=new THREE.Group();cyl(.182,.212,.5,'#efe4d6',0,.96,0,g);return g;}
function buildBottom(type,col){const g=new THREE.Group(),c=CLOTH[col][1];
 if(type==='etek'){cyl(.205,.33,.38,c,0,.6,0,g);cyl(.212,.212,.04,shade(c,-.08),0,.775,0,g);}
 else{cyl(.212,.205,.16,c,0,.7,0,g);cyl(.214,.214,.03,shade(c,-.1),0,.765,0,g);for(const s of[-1,1]){if(type==='pantolon')cyl(.088,.078,.63,c,s*.09,.35,0,g);else cyl(.093,.091,.2,c,s*.09,.56,0,g);}}
 return g;}
function buildLeggings(){const g=new THREE.Group(),c='#9a95a3';cyl(.206,.2,.14,c,0,.7,0,g);for(const s of[-1,1])cyl(.077,.068,.64,c,s*.09,.38,0,g);return g;}
function buildDress(type,col){const g=new THREE.Group(),c=CLOTH[col][1];
 cyl(.19,.205,.42,c,0,1.0,0,g);
 if(type==='kisa')cyl(.205,.34,.44,c,0,.58,0,g);else cyl(.205,.42,.78,c,0,.41,0,g);
 cyl(.209,.209,.035,shade(c,-.1),0,.8,0,g);
 for(const s of[-1,1])box(.04,.025,.34,c,s*.1,1.255,0,g);
 return g;}
function buildShoes(type,col){const g=new THREE.Group(),c=CLOTH[col][1];
 for(const s of[-1,1]){const x=s*.09;
  if(type==='spor'){box(.125,.075,.235,c,x,.05,.03,g);box(.13,.03,.245,'#fbfbf8',x,.015,.03,g);box(.09,.012,.08,shade(c,c==='#f6f2ea'?-.2:.2),x,.09,.06,g);}
  else if(type==='topuklu'){const p=box(.11,.05,.22,c,x,.065,.04,g);p.rotation.x=-.18;cyl(.017,.012,.09,c,x,.045,-.065,g);}
  else{box(.125,.09,.235,c,x,.045,.03,g);cyl(.082,.08,.26,c,x,.2,-.01,g);box(.13,.025,.245,shade(c,-.12),x,.012,.03,g);}}
 return g;}
function buildHair(style,c){const g=new THREE.Group();
 const kisa=style==='kisa';

    const bl=new THREE.Mesh(new THREE.CircleGeometry(.038,20),new THREE.MeshBasicMaterial({color:'#f2879a',transparent:true,opacity:.75}));bl.position.set(s*.12,1.405,.165);bl.rotation.y=s*.62;b.add(bl);this['bl'+s]=bl;

  }
  this.gar=new THREE.Group();b.add(this.gar);
  this.root.userData.act={kind:'customer'};
  this.state=opt.state;this.refresh();
 }
 refresh(){const s=this.state,g=this.gar;
  while(g.children.length){const o=g.children[0];g.remove(o);disposeTree(o);}
  if(s.dress)g.add(buildDress(s.dress.type,s.dress.color));
  else{g.add(s.top?buildTop(s.top.type,s.top.color):buildUnder());g.add(s.bottom?buildBottom(s.bottom.type,s.bottom.color):buildLeggings());}
  if(s.shoes)g.add(buildShoes(s.shoes.type,s.shoes.color));

 }
 face(a){this.root.rotation.y=a;}
 walkTo(x,z,dur,done,endFace){if(this.walkT)this.walkT.dead=true;const sx=this.root.position.x,sz=this.root.position.z;
  if(Math.hypot(x-sx,z-sz)<.01){if(endFace!=null)this.face(endFace);done&&done();return;}
  this.face(Math.atan2(x-sx,z-sz));this.walking=true;
  this.walkT=tween(dur,k=>{this.root.position.x=sx+(x-sx)*k;this.root.position.z=sz+(z-sz)*k;this.body.position.y=Math.abs(Math.sin(k*dur*9))*.035;this.body.rotation.z=Math.sin(k*dur*9)*.03;},
   ()=>{this.walking=false;this.walkT=null;this.body.position.y=0;this.body.rotation.z=0;if(endFace!=null)this.face(endFace);done&&done();});}
 pop(){const b=this.body;tween(.35,k=>{const s=1+Math.sin(k*Math.PI)*.06;b.scale.set(s,1+Math.sin(k*Math.PI)*.04,s);},()=>b.scale.set(1,1,1));}
}

function randLook(){const s={top:null,bottom:null,dress:null,shoes:{type:pick(keys(SHOES)),color:pick(keys(CLOTH))},
  hair:{style:pick(keys(HAIRS)),color:pick(['siyah','kahve','sari','kizil','siyah','kahve'])},lip:R()<.35?pick(keys(LIPC)):null,eye:R()<.25?pick(keys(EYEC)):null,blush:R()<.3};
 if(R()<.3)s.dress={type:pick(keys(DRESS)),color:pick(keys(CLOTH))};else{s.top={type:pick(keys(TOPS)),color:pick(keys(CLOTH))};s.bottom={type:pick(keys(BOTS)),color:pick(keys(CLOTH))};}
 return s;}
function genRequest(day){
 const dressMode=R()<.35;
 const outfit=dressMode?[['dress','type'],['dress','color']]:[['top','type'],['top','color'],['bottom','type'],['bottom','color']];
 const others=[['shoes','type'],['shoes','color'],['hair','style'],['hair','color'],['lip',null],['eye',null],['blush',null]];
 const k=Math.min(2+day,outfit.length+others.length);
 const o=shuffle(outfit.slice());const first=o.shift();
 const chosen=[first].concat(shuffle(o.concat(others)).slice(0,k-1));
 const negP=day>=3?Math.min(.12+.04*day,.35):0;
 const cons=chosen.map(([slot,field])=>{const c={slot,field,neg:false};
  if(field==='type')c.value=pick(keys({top:TOPS,bottom:BOTS,dress:DRESS,shoes:SHOES}[slot]));
  else if(field==='color')c.value=pick(keys(CLOTH));
  else if(field==='style')c.value=pick(keys(HAIRS));
  if(slot==='hair'&&field==='color')c.value=pick(keys(HAIRC));
  if(slot==='lip')c.value=R()<.15?'yok':pick(keys(LIPC));
  if(slot==='eye')c.value=R()<.15?'yok':pick(keys(EYEC));
  if(slot==='blush')c.value=R()<.65;
  const colorish=field==='color'||((slot==='lip'||slot==='eye')&&c.value!=='yok');
  if(colorish&&R()<negP)c.neg=true;
  return c;});
 return {cons,occasion:pick(OCC),text:describe(cons)};}
function describe(cons){const by={};cons.forEach(c=>{(by[c.slot]=by[c.slot]||[]).push(c);});const P=[];
 const cl=(slot)=>{const cs=by[slot];if(!cs)return;const t=cs.find(c=>c.field==='type'),co=cs.find(c=>c.field==='color');
  const N={top:TOPS,bottom:BOTS,dress:DRESS,shoes:SHOES}[slot];const tn=t&&N[t.value],cn=co&&CLOTH[co.value][0];
  const T={
   top:{full:`Üstüme ${cn} bir ${tn} istiyorum.`,type:`Üstte ${tn} olsun, rengi fark etmez.`,col:`Üstüm ${cn} olsun, modeli sana kalmış.`,typeNeg:`Üstüme ${tn} istiyorum ama ${cn} olmasın.`,neg:`Üstüme bir şey giyeceğim ama sakın ${cn} olmasın.`},
   bottom:{full:`Altıma ${cn} bir ${tn} istiyorum.`,type:`Altta ${tn} olsun, rengi fark etmez.`,col:`Altım ${cn} olsun, ne olduğu fark etmez.`,typeNeg:`Altıma ${tn} istiyorum ama ${cn} olmasın.`,neg:`Altıma bir şey giyeceğim ama ${cn} olmasın.`},
   dress:{full:`${cap(cn||'')} bir ${tn} giymek istiyorum.`,type:`${cap(tn||'')} giymek istiyorum, rengi sana kalmış.`,col:`${cap(cn||'')} bir elbise giymek istiyorum, kısa ya da uzun fark etmez.`,typeNeg:`${cap(tn||'')} giymek istiyorum ama ${cn} olmasın.`,neg:`Elbise giymek istiyorum ama ${cn} olmasın.`},
   shoes:{full:`Ayağıma ${cn} ${tn} lazım.`,type:`Ayakkabı olarak ${tn} giyeyim, rengi fark etmez.`,col:`Ayakkabılarım ${cn} olsun.`,typeNeg:`Ayağıma ${tn} lazım ama ${cn} olmasın.`,neg:`Ayakkabılarım ${cn} olmasın.`}}[slot];
  if(t&&co)P.push(co.neg?T.typeNeg:T.full);else if(t)P.push(T.type);else P.push(co.neg?T.neg:T.col);};
 cl('dress');cl('top');cl('bottom');cl('shoes');
 if(by.hair){const st=by.hair.find(c=>c.field==='style'),co=by.hair.find(c=>c.field==='color');
  if(st)P.push(`Saç modelim ${HAIRS[st.value]} olsun.`);
  if(co)P.push(co.neg?`Saçım ${HAIRC[co.value][0]} olmasın, ondan sıkıldım.`:`Saçımı ${HAIRC[co.value][0]} yap.`);}
 if(by.lip){const c=by.lip[0];P.push(c.value==='yok'?'Ruj istemiyorum.':c.neg?`Ruj sürersen ${LIPC[c.value][0]} olmasın.`:`Dudaklarıma ${LIPC[c.value][0]} ruj sür.`);}
 if(by.eye){const c=by.eye[0];P.push(c.value==='yok'?'Far sürme lütfen.':c.neg?`Far sürersen ${EYEC[c.value][0]} olmasın.`:`Gözlerime ${EYEC[c.value][0]} far.`);}
 if(by.blush){P.push(by.blush[0].value?'Yanaklarıma biraz allık.':'Allık istemem.');}
 return P.join(' ');}
const cmpC=(v,c)=>c.neg?v!==c.value:v===c.value;
function checkCon(s,c){
 if(c.slot==='top'||c.slot==='bottom'){if(s.dress||!s[c.slot])return false;return cmpC(s[c.slot][c.field],c);}
 if(c.slot==='dress'){if(!s.dress)return false;return cmpC(s.dress[c.field],c);}
 if(c.slot==='shoes'){if(!s.shoes)return false;return cmpC(s.shoes[c.field],c);}
 if(c.slot==='hair')return cmpC(s.hair[c.field],c);
 if(c.slot==='lip'||c.slot==='eye'){const v=s[c.slot];if(c.value==='yok')return v==null;return c.neg?v!==c.value:v===c.value;}
 if(c.slot==='blush')return s.blush===c.value;return false;}
function conLabel(c){const L={top:'üst',bottom:'alt',dress:'elbise',shoes:'ayakkabı'};if(L[c.slot])return L[c.slot]+(c.field==='color'?' rengi':' modeli');return{hair:c.field==='color'?'saç rengi':'saç modeli',lip:'ruj',eye:'far',blush:'allık'}[c.slot];}

 const lines=score===1?['Muhteşem olmuş! Tam istediğim gibi!','Bayıldım! Kesin yine geleceğim.','Harikasın, tam hayal ettiğim gibi!']:score>=.75?['Güzel olmuş ama bir iki şey eksik.','Fena değil, ama tam istediğim gibi değil.']:score>=.5?['Hmm... İstediğim tam olarak bu değildi.','Pek beğenmedim açıkçası.']:['Bu ne böyle? Hiç dinlemedin beni!','Böyle mi çıkacağım dışarı? Para falan vermem!'];
 const wrong=res.filter(r=>!r.ok).map(r=>conLabel(r.k));
 const html=`<div class="res"><span class="money">${total>0?'+'+total+' ₺':'Ödeme yok'}</span><span class="stars">${starSvg(stars>=1)+starSvg(stars>=2)+starSvg(stars>=3)}</span>${tip>0?`<div style="font-size:13px;color:#8a6475">${pay} ₺ ücret + ${tip} ₺ bahşiş</div>`:''}${wrong.length?`<div class="wrong">Hatalı: ${wrong.join(', ')}</div>`:''}<div style="font-size:13px;color:#8a6475;margin-top:3px">İtibar ${dr>0?'+':''}${dr}</div></div>`;
 dialog(c.name,pick(lines),[{t:'Güle güle',primary:true,fn:custLeave}],{html});}
function custLeave(){if(!S.cust)return;hideDialog();S.phase='leave';const c=S.cust;showCust(false);
 c.walkTo(0,6.6,2.3,()=>{scene.remove(c.root);disposeTree(c.root);S.cust=null;if(G.rep<=0){gameOver();return;}setTimeout(nextCustomer,700);});}
function angryLeave(){const c=S.cust;S.phase='angry';showNav(false);hideDialog();G.rep=clamp(G.rep-18,0,100);save();updHUD();
 const go=()=>{sfx.bad();dialog(c.name,pick(['Bu kadar beklenir mi? Ben gidiyorum!','Saatlerdir bekliyorum, başka butiğe gidiyorum!','Yeter artık, sabrım kalmadı!']),[{t:'Sıradaki',primary:true,fn:custLeave}],{html:'<div class="res"><span class="wrong">Müşteri kızıp gitti · İtibar -18</span></div>'});};
 if(S.room==='back')fade(()=>{setRoom('front');setView('counter',true);if(c.walkT)c.walkT.dead=true;c.root.position.set(0,0,.55);c.face(Math.PI);go();});else go();}
function endDay(){S.phase='dayend';showCust(false);showNav(false);hideDialog();const d=G.day;G.day++;save();
 const render=()=>{showOverlay(`<h2>Gün ${d} bitti</h2><div class="stats"><div><b>${S.dayEarn} ₺</b><small>Kazanç</small></div><div><b>${S.dayServed}/${S.custTotal}</b><small>Hizmet</small></div><div><b>${S.dayPerfect}</b><small>Kusursuz</small></div></div>
  <p style="font-size:15px">Kasada <b>${G.money} ₺</b> var. Dükkanı geliştir:</p>
  ${UPS.map(u=>`<div class="up"><div class="t"><b>${u.name}</b><small>${u.desc}</small></div>${G.up[u.id]?'<button class="btn" disabled>Alındı</button>':`<button class="btn primary" data-up="${u.id}" ${G.money<u.price?'disabled':''}>${u.price} ₺</button>`}</div>`).join('')}
  <p style="font-size:14px;color:#8a6475">Yarın müşteriler daha çok şey isteyecek ve daha sabırsız olacak.</p>
  <div class="btns"><button class="btn primary" id="bNext">Gün ${G.day}'e başla</button><button class="btn" id="bMenu">Ana menü</button></div>`);
  card.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const u=UPS.find(x=>x.id===b.dataset.up);if(G.money>=u.price&&!G.up[u.id]){G.money-=u.price;G.up[u.id]=true;save();updHUD();applyUpgrades();sfx.coin();render();}});
  $('#bNext').onclick=()=>{sfx.tap();startDay();};$('#bMenu').onclick=()=>{sfx.tap();titleScreen();};};
 render();}
function gameOver(){S.phase='over';showCust(false);showNav(false);hideDialog();const d=G.day;try{localStorage.removeItem('susenButik1');}catch(e){}
 showOverlay(`<h2>Susen Butik kapandı</h2><p>Dükkanın itibarı sıfıra indi, müşteriler artık gelmiyor.</p><div class="stats"><div><b>${d}</b><small>Gün</small></div><div><b>${G.money} ₺</b><small>Kasa</small></div></div><div class="btns"><button class="btn primary" id="bAgain">Baştan başla</button></div>`);
 $('#bAgain').onclick=()=>{G=freshG();save();startDay();};}

/* ---------------- ACTIONS ---------------- */
function repeatRequest(){if(S.phase!=='work'||!S.cust)return;S.pat-=.12;updPat();S.cust.pop();sfx.tap();
 dialog(S.cust.name,pick(['Yine mi? Peki, tekrar söylüyorum: ','Unuttun mu? ','Dinle bak: '])+S.req.text,[{t:'Tamam',fn:hideDialog}],{instant:true,html:'<div style="font-size:13px;color:#b04a4a">Sabrı azaldı</div>'});}
function act(a,obj){
 if(a.kind==='register'){if(S.phase==='pay')payNow();else if(S.phase!=='title')toast('Kasa şu an boş');return;}
 if(a.kind==='coffee'){if(S.phase==='order'&&S.cust){if(S.coffeeUsed){toast('Zaten kahve ikram ettin');return;}S.coffeeUsed=true;S.pat=Math.min(1,S.pat+.3);updPat();sfx.cloth();S.cust.pop();toast('Kahve ikram ettin, sabrı arttı');}else toast('Kahveyi kasada bekleyen müşteriye ikram edebilirsin');return;}
 if(a.kind==='customer'){if(S.phase==='work')repeatRequest();return;}
 if(S.phase!=='work')return;
 if(a.kind==='station'){goStation(a.view===S.view?a.view:a.view);return;}
 if(a.view&&a.view!==S.view){goStation(a.view);return;}
 const st=S.cust.state;let msg='';
 switch(a.kind){
  case 'top':st.top={...a.val};st.dress=null;msg=cap(CLOTH[a.val.color][0])+' '+TOPS[a.val.type]+' giydirildi';break;
  case 'bottom':st.bottom={...a.val};st.dress=null;msg=cap(CLOTH[a.val.color][0])+' '+BOTS[a.val.type]+' giydirildi';break;
  case 'dress':st.dress={...a.val};st.top=null;st.bottom=null;msg=cap(CLOTH[a.val.color][0])+' '+DRESS[a.val.type]+' giydirildi';break;
  case 'shoes':st.shoes={...a.val};msg=cap(CLOTH[a.val.color][0])+' '+SHOES[a.val.type]+' giydirildi';break;
  case 'hairstyle':st.hair.style=a.val;msg='Saç modeli: '+HAIRS[a.val];break;
  case 'haircolor':st.hair.color=a.val;msg='Saç rengi: '+HAIRC[a.val][0];break;
  case 'lip':st.lip=a.val;msg=cap(LIPC[a.val][0])+' ruj sürüldü';break;
  case 'eye':st.eye=a.val;msg=cap(EYEC[a.val][0])+' far sürüldü';break;
  case 'blush':st.blush=!st.blush;msg=st.blush?'Allık sürüldü':'Allık silindi';break;
  case 'remover':st.lip=null;st.eye=null;st.blush=false;msg='Makyaj temizlendi';break;
  default:return;}
 S.cust.refresh();S.cust.pop();sfx.cloth();toast(msg);
 if(obj){const o=obj;const s0=o.scale.x;tween(.25,k=>{o.scale.setScalar(s0*(1+Math.sin(k*Math.PI)*.15));},()=>o.scale.setScalar(s0));}
}

/* ---------------- INPUT ---------------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};});
canvas.addEventListener('pointerup',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;if(dx*dx+dy*dy>200)return;ac();tap(e.clientX,e.clientY);});
let pipRect=null;
function tap(x,y){
 if(pipRect&&x>=pipRect.x&&x<=pipRect.x+pipRect.w&&y>=pipRect.y&&y<=pipRect.y+pipRect.h){repeatRequest();return;}
 if(S.phase==='title'||S.phase==='dayend'||S.phase==='over')return;
 ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
 const hits=ray.intersectObjects(scene.children,true);
 for(const h of hits){let o=h.object;if(!o.visible)continue;let vis=true;let p=o;while(p){if(!p.visible){vis=false;break;}p=p.parent;}if(!vis)continue;
  while(o){if(o.userData&&o.userData.act){act(o.userData.act,o);return;}o=o.parent;}
  if(h.object.material!==hitMat)return;}
}

/* ---------------- LOOP ---------------- */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;setView(S.view,false);}
window.addEventListener('resize',()=>setTimeout(resize,50));window.addEventListener('orientationchange',()=>setTimeout(resize,250));
const pipEl=$('#pipFrame');
const clock=new THREE.Clock();let tt=0;
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);tt+=dt;updTweens(dt);
 const k=1-Math.exp(-dt*5.5);cam.pos.lerp(cam.tPos,k);cam.look.lerp(cam.tLook,k);cam.fov+=(cam.tFov-cam.fov)*k;
 camera.position.copy(cam.pos);camera.lookAt(cam.look);if(Math.abs(camera.fov-cam.fov)>.01){camera.fov=cam.fov;camera.updateProjectionMatrix();}
 if(S.cust&&!S.cust.walking){S.cust.body.rotation.y=Math.sin(tt*.9)*.05;S.cust.body.position.y=Math.sin(tt*1.8)*.004;}
 if(S.phase==='order'||S.phase==='work'){S.pat-=dt/S.patDur;updPat();if(S.pat<=0){S.pat=0;angryLeave();}}
 if(registerG){const s=S.phase==='pay'?1+Math.max(0,Math.sin(tt*6))*.06:1;registerG.scale.setScalar(s);}
 if(coffeeG&&coffeeG.visible){const s=S.phase==='order'&&!S.coffeeUsed?1+Math.max(0,Math.sin(tt*4))*.03:1;coffeeG.scale.setScalar(s);}
 const W=innerWidth,H=innerHeight;
 renderer.setScissorTest(false);renderer.setViewport(0,0,W,H);renderer.render(scene,camera);
 const pipOn=S.phase==='work'&&S.cust&&(S.view==='wardA'||S.view==='wardB'||S.view==='shoes');
 if(pipOn){const por=W<H;const pw=Math.round(por?W*.26:Math.min(W*.2,H*.32)),ph=Math.round(pw*1.35);const px=W-pw-14-(por?0:60),py=por?118:70;
  pipRect={x:px,y:py,w:pw,h:ph};const cp=S.cust.root.position;pipCam.aspect=pw/ph;pipCam.updateProjectionMatrix();pipCam.position.set(cp.x,1.05,cp.z+2.4);pipCam.lookAt(cp.x,.85,cp.z);
  renderer.setScissorTest(true);renderer.setScissor(px,H-py-ph,pw,ph);renderer.setViewport(px,H-py-ph,pw,ph);renderer.render(scene,pipCam);renderer.setScissorTest(false);
  pipEl.style.display='block';pipEl.style.left=(px-7)+'px';pipEl.style.top=(py-7)+'px';pipEl.style.width=(pw+14)+'px';pipEl.style.height=(ph+14)+'px';}
 else{pipRect=null;pipEl.style.display='none';}
}

/* ---------------- BOOT ---------------- */
buildFront();buildBack();
G=load()||freshG();applyUpgrades();setRoom('front');
resize();setView('counter',true);
// idle preview customer on title
titleScreen();
frame();
})();
</script>
</body>
