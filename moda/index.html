<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Moda Dünyası">
<meta name="theme-color" content="#ff9ccf">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Moda Dünyası ✨</title>
<style>
:root{--pink:#ff5fa2;--pink2:#ff9ccf;--lilac:#c78bff;--ink:#4a2c4a;--soft:#fff3f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;color:var(--ink);
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
 background:#ffe6f2 radial-gradient(#ffc9e2 2.5px,transparent 3px) 0 0/30px 30px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{display:grid;height:100vh;height:100dvh;grid-template-columns:minmax(0,1fr) minmax(360px,46%);gap:14px;
 padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
@media (orientation:portrait){#app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,54fr) minmax(0,46fr)}}
.stagebox,.panel{min-width:0;min-height:0}

/* ---------- sahne ---------- */
.stagebox{position:relative;background:#fff;border-radius:32px;padding:8px;display:flex;flex-direction:column;min-height:0;
 box-shadow:0 7px 0 #f2a5c8,0 16px 34px rgba(170,60,120,.22)}
.topbar{display:flex;align-items:center;gap:8px;padding:2px 4px 8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:6px 14px;font-weight:800;font-size:18px;
 box-shadow:0 0 0 3px #ffd3e8 inset}
.chip.star{background:#fff8d6;box-shadow:0 0 0 3px #ffe58a inset}
.sp{flex:1}
.tbtn{width:52px;height:52px;border-radius:18px;background:#fff;font-size:28px;display:grid;place-items:center;
 box-shadow:0 0 0 3px #ffd3e8,0 5px 0 #f4b6d3;transition:transform .12s}
.tbtn:active{transform:translateY(3px) scale(.94);box-shadow:0 0 0 3px #ffd3e8,0 2px 0 #f4b6d3}
.tbtn.cam{background:linear-gradient(#ff8cc0,#ff5fa2);box-shadow:0 0 0 3px #fff,0 5px 0 #d94584}
.stagewrap{flex:1;min-height:0;position:relative;border-radius:24px;overflow:hidden;-webkit-mask-image:-webkit-radial-gradient(white,black)}
#stage{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#trash{position:absolute;left:22px;bottom:22px;width:74px;height:74px;border-radius:50%;background:#fff;display:none;place-items:center;font-size:38px;
 box-shadow:0 0 0 4px #ff9ccf,0 6px 14px rgba(0,0,0,.2)}
#trash.show{display:grid}#trash.hot{transform:scale(1.25);background:#ffe0ee}

/* svg animasyonları */
.bounce{animation:bounce .45s ease}
@keyframes bounce{0%{transform:scale(1)}35%{transform:scale(1.04,.96)}65%{transform:scale(.98,1.03)}100%{transform:scale(1)}}
#dollInner,#petInner{transform-box:fill-box;transform-origin:50% 100%}
.jump{animation:jump .6s ease}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-40px) rotate(-8deg)}70%{transform:translateY(0) scale(1.08,.92)}}
.stk{cursor:grab}

/* ---------- panel ---------- */
.panel{display:flex;flex-direction:column;min-height:0;gap:10px}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:6px 6px 12px;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;width:76px;height:80px;border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
 box-shadow:0 0 0 3px #ffd3e8,0 5px 0 #f4b6d3;transform:rotate(var(--r,0deg));transition:transform .15s}
.tab i{font-style:normal;font-size:32px;line-height:1}
.tab span{font-size:13px;font-weight:800}
.tab.on{background:linear-gradient(#ffb2d6,#ff7ab5);color:#fff;box-shadow:0 0 0 4px #fff,0 0 0 7px #ff7ab5,0 7px 0 #d94584;transform:rotate(0) scale(1.06)}
.content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:30px;padding:16px 16px 30px;
 box-shadow:0 7px 0 #f2a5c8,0 16px 34px rgba(170,60,120,.18)}
h3{margin:4px 4px 12px;font-size:20px;display:flex;align-items:center;gap:8px}
h3:not(:first-child){margin-top:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px}
.card{position:relative;background:var(--soft);border-radius:22px;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;
 box-shadow:0 0 0 4px #fff,0 0 0 7px #ffd6ea,0 7px 0 4px #f6c1db;transform:rotate(var(--r,0deg));transition:transform .15s}
.card:active{transform:rotate(var(--r,0deg)) scale(.93)}
.card svg{width:100%;height:96px}
.card span{font-size:14px;font-weight:800;margin-top:2px}
.card.sel{background:#ffe1f0;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--pink),0 8px 0 5px #d94584}
.card.sel::after{content:"✓";position:absolute;top:-10px;right:-8px;width:30px;height:30px;border-radius:50%;background:var(--pink);color:#fff;
 display:grid;place-items:center;font-weight:900;box-shadow:0 0 0 3px #fff}
.card.lock svg{filter:grayscale(1) opacity(.45)}
.card .lk{position:absolute;inset:auto 0 30px;margin:auto;width:max-content;background:#fff;border-radius:999px;padding:3px 10px;font-weight:900;font-size:14px;
 box-shadow:0 0 0 3px #ffe58a}
.none{font-size:44px;height:96px;display:grid;place-items:center;opacity:.6}
.sws{display:flex;flex-wrap:wrap;gap:12px;padding:4px}
.sw{width:54px;height:54px;border-radius:50%;background:var(--c);box-shadow:0 0 0 5px #fff,0 0 0 8px #ffd6ea,0 5px 0 6px #f6c1db;
 display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff;transition:transform .12s}
.sw:active{transform:scale(.9)}
.sw.sel{box-shadow:0 0 0 5px #fff,0 0 0 9px var(--pink),0 6px 0 8px #d94584;transform:scale(1.08)}
.sw.sel::after{content:"✓";text-shadow:0 1px 2px rgba(0,0,0,.4)}
.sw.x{background:#fff;color:#e05;font-size:26px}.sw.x.sel::after{content:""}
.toggles{display:flex;gap:14px;flex-wrap:wrap}
.tog{flex:1;min-width:130px;padding:14px;border-radius:22px;background:var(--soft);font-size:18px;font-weight:800;
 box-shadow:0 0 0 4px #fff,0 0 0 7px #ffd6ea,0 6px 0 4px #f6c1db}
.tog.sel{background:#ffe1f0;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--pink),0 7px 0 5px #d94584}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:14px}
.emo button{font-size:46px;height:78px;border-radius:22px;background:var(--soft);box-shadow:0 0 0 4px #fff,0 0 0 7px #ffd6ea,0 6px 0 4px #f6c1db;transform:rotate(var(--r))}
.emo button:active{transform:scale(.88)}
.hint{background:#fff8d6;border-radius:18px;padding:12px 14px;font-weight:700;font-size:16px;margin:4px 0 14px;box-shadow:0 0 0 3px #ffe58a inset}
.big{display:block;width:100%;margin-top:16px;padding:16px;border-radius:22px;font-size:20px;font-weight:900;color:#fff;
 background:linear-gradient(#ff8cc0,#ff5fa2);box-shadow:0 0 0 4px #fff,0 6px 0 4px #d94584}
.big.alt{background:linear-gradient(#d4b0ff,#a96cf5);box-shadow:0 0 0 4px #fff,0 6px 0 4px #8248cf}
.big:active{transform:translateY(3px)}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--soft);margin-bottom:10px;font-size:17px;font-weight:700}
.task i{font-style:normal;font-size:30px}.task b{margin-left:auto;font-size:26px}
.task.ok{background:#e6ffef;text-decoration:line-through;text-decoration-color:#4bbf7a;text-decoration-thickness:3px}
.unl{display:flex;flex-wrap:wrap;gap:8px}
.unl span{background:#fff8d6;border-radius:999px;padding:6px 12px;font-weight:800;box-shadow:0 0 0 3px #ffe58a inset}
.unl span.ok{background:#e6ffef;box-shadow:0 0 0 3px #9be3b6 inset}

/* ---------- modallar ---------- */
.modal{position:fixed;inset:0;background:rgba(255,190,220,.82);display:none;
 place-items:center;z-index:50;padding:20px}
.modal.show{display:grid}
.box{background:#fff;border-radius:34px;padding:22px;max-width:min(560px,94vw);max-height:92vh;overflow:auto;text-align:center;
 box-shadow:0 0 0 6px #fff,0 0 0 10px #ff9ccf,0 14px 0 10px #e57aad;animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6) rotate(-6deg);opacity:0}70%{transform:scale(1.05) rotate(1deg)}100%{transform:none;opacity:1}}
.box h2{margin:0 0 10px;font-size:32px}
.box p{font-size:18px;font-weight:700;margin:8px 0}
.box input{width:100%;font:inherit;font-size:26px;font-weight:800;text-align:center;padding:14px;border-radius:20px;border:0;outline:0;
 background:var(--soft);box-shadow:0 0 0 4px #ffd3e8 inset;color:var(--ink);-webkit-user-select:text;user-select:text}
.photo img{width:100%;max-height:60vh;object-fit:contain;border-radius:20px;box-shadow:0 0 0 6px #fff,0 0 0 9px #ffd6ea;
 -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.gal img{width:100%;border-radius:14px;box-shadow:0 0 0 4px #fff,0 0 0 7px #ffd6ea;transform:rotate(var(--r))}
.row{display:flex;gap:12px}.row .big{flex:1}
.sw.lock{filter:grayscale(.85);opacity:.55}
.sw.pat{background:#fff;overflow:hidden}.sw.pat svg{width:100%;height:100%;display:block;border-radius:50%}
.emo button.sel{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--pink),0 6px 0 6px #d94584;background:#ffe1f0}
.emo button small{font-size:13px;display:block;font-weight:800;margin-top:-6px}
.gcards{display:grid;gap:18px}
.gcard{display:grid;grid-template-columns:72px 1fr;align-items:center;text-align:left;gap:2px 14px;padding:18px;border-radius:26px;background:var(--soft);
 box-shadow:0 0 0 4px #fff,0 0 0 7px #ffd6ea,0 7px 0 4px #f6c1db;transform:rotate(var(--r,0deg))}
.gcard:active{transform:scale(.96)}
.gcard i{grid-row:1/3;font-style:normal;font-size:54px;text-align:center}.gcard b{font-size:21px}.gcard span{font-size:15px;font-weight:700;opacity:.75}
.game{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;gap:12px;
 padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
 background:#ffe6f2 radial-gradient(#ffc9e2 2.5px,transparent 3px) 0 0/30px 30px}
.game.show{display:flex}
.ghead{display:flex;align-items:center;gap:12px;flex:none}.ghead h2{margin:0;font-size:26px}
.gbody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.gwrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,40%);gap:14px}
@media (orientation:portrait){.gwrap{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,52fr) minmax(0,48fr)}}
.gstage{background:#fff;border-radius:30px;box-shadow:0 7px 0 #f2a5c8,0 16px 34px rgba(170,60,120,.2);position:relative;min-height:0;overflow:hidden}
.gstage svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.showbar{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;
 padding:8px 8px 8px 18px;font-size:18px;font-weight:800;box-shadow:0 0 0 4px #ff9ccf,0 8px 20px rgba(0,0,0,.18);white-space:nowrap;z-index:5}
.showbar button{padding:10px 16px;border-radius:999px;color:#fff;font-weight:900;background:linear-gradient(#ff8cc0,#ff5fa2);box-shadow:0 4px 0 #d94584}
.showbar .x{background:#f1f1f1;color:#999;box-shadow:none;padding:10px 14px}
.runway{flex:1;min-height:0;position:relative;border-radius:30px;overflow:hidden;background:#2b1650}
.runway svg{position:absolute;inset:0;width:100%;height:100%}
.walker{transform-origin:0 0;animation:walk 3.2s ease-out both}
@keyframes walk{0%{transform:translateY(-170px) scale(.48)}20%{transform:translateY(-134px) scale(.58) rotate(-2deg)}40%{transform:translateY(-98px) scale(.68) rotate(2deg)}
 60%{transform:translateY(-62px) scale(.79) rotate(-2deg)}80%{transform:translateY(-26px) scale(.9) rotate(2deg)}100%{transform:translateY(0) scale(1)}}
.fl{animation:fl 1.3s infinite;opacity:0}@keyframes fl{0%,100%{opacity:0}8%{opacity:1}22%{opacity:0}}
.judges{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:12px;padding:0 10px}
.judge{background:#fff;border-radius:22px;padding:10px 12px;text-align:center;min-width:100px;box-shadow:0 0 0 4px #ff9ccf,0 8px 16px rgba(0,0,0,.25);animation:pop .4s ease both}
.judge i{font-style:normal;font-size:40px;display:block}.judge b{font-size:36px;color:var(--pink);display:block;line-height:1.1}.judge small{font-weight:800;font-size:13px}
.result{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(92%,540px);background:#fff;border-radius:26px;padding:14px 18px;text-align:center;
 box-shadow:0 0 0 5px #ffe066,0 10px 24px rgba(0,0,0,.25);animation:pop .4s ease both}
.result h2{margin:0;font-size:30px}.result p{margin:6px 0;font-weight:800;font-size:17px}
.result .row .big{margin-top:10px;padding:12px;font-size:18px}
.tips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}.tips span{background:var(--soft);border-radius:999px;padding:5px 11px;font-size:14px;font-weight:800}
.tips span.ok{background:#e6ffef;box-shadow:0 0 0 2px #9be3b6 inset}
.judge em{display:block;font-style:normal;font-size:12px;font-weight:700;max-width:130px;margin-top:2px}.judge em.fav{color:#e8406a;font-weight:900}
.poser{transform-origin:0 0}.poser.pose{animation:pose 1s ease}
@keyframes pose{0%{transform:scale(1)}25%{transform:scale(-1,1)}50%{transform:scale(1,1)}70%{transform:scale(1.08,.94)}85%{transform:scale(.97,1.04)}100%{transform:scale(1)}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-75vh) scale(1.2);opacity:0}}
.resWrap{position:absolute;inset:0;display:grid;place-items:center;background:rgba(30,10,50,.45);padding:12px;overflow:auto}
.resWrap .result{position:static;transform:none;width:min(100%,560px)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:10px 0 4px}
.pod{display:flex;flex-direction:column;align-items:center;width:96px}.pod i{font-style:normal;font-size:32px}.pod small{font-weight:900;font-size:14px;margin-bottom:3px}
.pod .bar{width:100%;border-radius:14px 14px 4px 4px;background:#ffd6ea;font-weight:900;font-size:15px;display:flex;flex-direction:column;justify-content:center;line-height:1.15}
.pod.me .bar{background:linear-gradient(#ffe066,#ffb02e);box-shadow:0 0 0 3px #fff,0 0 0 6px #ffb02e}.pod.me small{color:#e8406a}
.order{position:absolute;left:12px;top:12px;right:12px;background:#fff;border-radius:22px;padding:10px 14px;display:flex;gap:12px;align-items:center;
 box-shadow:0 0 0 4px #ffe066,0 6px 14px rgba(0,0,0,.15);font-weight:700;font-size:16px;z-index:2;animation:pop .4s ease both}
.order.bot{top:auto;bottom:12px}
.order{align-items:flex-start;font-size:15px}.reqs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.reqs span{font-size:13.5px;font-weight:800;background:var(--soft);border-radius:999px;padding:4px 10px}.reqs span.ok{background:#e6ffef;box-shadow:0 0 0 2px #9be3b6 inset}
.order i{font-style:normal;font-size:46px;line-height:1}
.react{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;z-index:3;background:rgba(255,255,255,.55);animation:pop .4s ease both}
.react div{font-size:120px;line-height:1}.react b{font-size:30px;text-align:center;background:#fff;border-radius:22px;padding:8px 18px;box-shadow:0 0 0 4px #ffe066}
.fan{position:absolute;right:20px;bottom:20px;font-size:80px;z-index:2;animation:wind .25s ease-in-out infinite alternate}
@keyframes wind{from{transform:translateX(0) scale(1)}to{transform:translateX(-14px) scale(1.12)}}
.tog small{font-size:12px;opacity:.75}
.buyprev{width:180px;height:200px;margin:0 auto 8px;background:var(--soft);border-radius:26px;display:grid;place-items:center;box-shadow:0 0 0 4px #fff,0 0 0 7px #ffd6ea}
.buyprev svg{width:90%;height:90%}
.giftbox{font-size:110px;cursor:pointer;animation:wiggle 1s ease-in-out infinite}.giftbox.open{animation:pop .5s ease}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) scale(1.05)}75%{transform:rotate(10deg) scale(1.05)}}
.gcard.gift{background:linear-gradient(#fff6c2,#ffe58a);margin-bottom:18px;width:100%}.gcard.gift i{animation:wiggle 1.2s ease-in-out infinite}.gcard.gift.used{background:var(--soft);opacity:.7}.gcard.gift.used i{animation:none}
button.chip{cursor:pointer}
.memhud{font-size:20px;font-weight:800;margin:4px 0 14px}
.memgrid{display:grid;gap:10px;width:100%;max-width:min(680px,calc((100dvh - 230px) / var(--rows) * var(--cols) * .78))}
.mcard{aspect-ratio:3/4;perspective:700px}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.open .in{transform:rotateY(180deg)}
.mcard .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:grid;place-items:center;font-size:clamp(28px,5.5vw,56px);box-shadow:0 0 0 4px #fff,0 0 0 7px #ffd6ea,0 6px 0 4px #f6c1db}
.mcard .back{background:linear-gradient(#ffb2d6,#ff7ab5);font-size:clamp(22px,4vw,40px)}
.mcard .front{background:#fff;transform:rotateY(180deg)}
.mcard.done .front{background:#e6ffef;box-shadow:0 0 0 4px #fff,0 0 0 7px #9be3b6}
.catch{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:30px;background:linear-gradient(#bfe9ff,#ffe6f2);touch-action:none;box-shadow:0 7px 0 #f2a5c8}
.catch.hurt{animation:shake .4s}
.chud{position:absolute;left:0;right:0;top:10px;display:flex;justify-content:space-around;font-size:24px;font-weight:900;z-index:2;pointer-events:none}
.chud span{background:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 0 0 3px #ffd3e8}
.bag{position:absolute;left:0;bottom:22px;width:72px;text-align:center;font-size:64px;will-change:transform;pointer-events:none}
.drop{position:absolute;left:0;top:0;font-size:44px;will-change:transform;pointer-events:none}
.hitpop{position:absolute;font-size:26px;font-weight:900;color:#ff5fa2;pointer-events:none;animation:rise .7s ease-out forwards}
.dance{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,42fr) minmax(0,58fr);gap:14px}
@media (orientation:portrait){.dance{grid-template-columns:1fr;grid-template-rows:minmax(0,34fr) minmax(0,66fr)}}
.dstage{position:relative;border-radius:30px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#ff9ccf,#5c1f7a 75%);box-shadow:0 7px 0 #f2a5c8}
.dstage svg{position:absolute;inset:0;width:100%;height:100%}
#dDoll{transform-origin:0 0}.dmove{animation:dm1 .35s ease}.dmove2{animation:dm2 .35s ease}
@keyframes dm1{50%{transform:rotate(-7deg) translateY(-14px)}}@keyframes dm2{50%{transform:rotate(7deg) translateY(-14px) scale(1.03)}}
.dhud{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.dhud b{background:#fff;border-radius:999px;padding:6px 16px;font-size:24px;box-shadow:0 0 0 3px #ffd3e8}.dhud span{color:#fff;font-weight:900;font-size:20px;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.dfb{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-size:34px;font-weight:900;color:#fff;text-shadow:0 3px 0 #d94584;transition:.15s;pointer-events:none;white-space:nowrap}
.dfb.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.dfb.pf{color:#ffe066}
.lanes{position:relative;border-radius:30px;overflow:hidden;background:#2b1650;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 7px 0 #f2a5c8;touch-action:none}

#toast{pointer-events:none;position:fixed;left:50%;top:22px;transform:translate(-50%,-160%);background:#fff;padding:14px 24px;border-radius:999px;font-size:20px;font-weight:900;z-index:70;

#toast.show{transform:translate(-50%,0)}
.conf{position:fixed;top:-60px;font-size:34px;z-index:65;pointer-events:none;animation:fall linear forwards}

@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.title{font-size:44px;font-weight:900;color:var(--pink);text-shadow:3px 3px 0 #fff,5px 5px 0 #ffc2df;margin:6px 0}

  case 'cserp':{const ar=cakeAreas(),cols=['#ff5fa2','#7ec8ff','#ffe066','#7be0b4','#c78bff','#ff8a5c','#fff'];
   for(let i=0;i<28;i++){const a=rnd(ar),x=a[0]+Math.random()*(a[2]-a[0]),y=a[1]+14+Math.random()*(a[3]-a[1]-14);S.cake.tops.push({e:'serp',x:Math.round(x),y:Math.round(y),c:rnd(cols),r:(Math.random()*180)|0,s:own('c-star')&&Math.random()<.5})}
   while(S.cake.tops.length>160)S.cake.tops.shift();for(let i=0;i<8;i++)tone(1200+Math.random()*900,.03,'square',.03,i*.04);save();$('#cSvg').innerHTML=cakeSvg();updCOrder();return true}
  case 'ctext':S.cake.text=($('#cText').value||'').trim().slice(0,16);$('#cText').blur();SND.pop();save();$('#cSvg').innerHTML=cakeSvg();updCOrder();return true;
  case 'cclear':Object.assign(S.cake,{tops:[],bites:[],text:'',lit:true});SND.pop();save();renderCake();return true;
  case 'clight':S.cake.lit=true;tone(600,.1);save();renderCake();return true;
  case 'cblow':{if(!S.cake.tops.some(t=>t.e==='mum')){SND.no();toast('Önce pastaya mum dik 🕯️',1800);return true}
   S.cake.lit=false;for(let i=0;i<10;i++)tone(900-i*60,.06,'sawtooth',.03,i*.03);setTimeout(()=>[523,523,587,523,698,659].forEach((f,i)=>tone(f,.28,'triangle',.12,i*.3)),400);
   confetti(24);toast('İyi ki doğdun! 🎉🎂',2500);save();renderCake();if(S.cake.tops.length>=5)checkTasks('pasta');else setTimeout(()=>toast('Görev için en az 5 süs koy 🍓',2200),2700);return true}
  case 'ccust':newCakeOrder();return true;
  case 'cgive':giveCake();return true;
  case 'cbye':cOrd=null;SND.tap();renderCake();return true;
 }
 return false}

/* =====================  mağaza  ===================== */
function accVB(k){return ['canta','asa','kalpcanta','mikrofon'].includes(k)?'40 200 200 180':k==='kolye'?'95 120 110 100':k==='sapka'?'60 5 180 160':k==='pelerin'?'20 150 260 400':k==='perikanat'?'20 140 260 260':k==='atki'?'95 150 110 110':k==='kep'?'75 15 160 150':'75 25 150 150'}
function thumbFor(cat,k){switch(cat){
 case 'dress':return mini('40 160 220 410',withS(c=>{c.dress=k;c.acc=[];c.emb=[]}));
 case 'shoes':return mini('104 452 94 120',withS(c=>{c.shoes=k;c.dress='yok';c.bottom='sort';c.socks='yok'}));
 case 'acc':return mini(accVB(k),withS(c=>{c.acc=[k]}));
 case 'hair':return mini('50 12 200 320',withS(c=>{c.hair.k=k;c.acc=[]}));
 case 'pet':return `<svg viewBox="-70 -125 140 135">${PETS[k].f()}</svg>`;
 case 'bg':return `<svg viewBox="0 0 400 640" preserveAspectRatio="xMidYMid slice">${BGS[k].d()}</svg>`}return ''}
let buyItem=null;
function openBuy(cat,k){const it=LOOK[cat][k];buyItem={cat,k,it};SND.tap();$('#buyOk').style.display='';
 $('#buyPrev').innerHTML=thumbFor(cat,k);$('#buyName').textContent=it.n;
 $('#buyPrice').innerHTML=`Fiyatı: <b>💰 ${it.price}</b> · Senin altının: <b>💰 ${S.coins||0}</b>`;$('#mBuy').classList.add('show')}
$('#buyOk').onclick=()=>{if(!buyItem)return;const {cat,k,it}=buyItem;
 if((S.coins||0)<it.price){SND.no();const b=$('#buyOk');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast(`💰 ${it.price-(S.coins||0)} altın daha lazım! Mini oyun oyna 🎮`,2400);return}
 S.coins-=it.price;S.owned=[...(S.owned||[]),'p:'+it.pid];save();updCoins();$('#mBuy').classList.remove('show');SND.star();confetti(24);toast(`${it.n} senin oldu! 🎉`,2200);
 buyItem=null;act(cat,k);checkTasks()};
function shopPanel(){const sec=(t,cat,obj)=>{const it=Object.entries(obj).filter(([k,v])=>v.price);if(!it.length)return '';
  return `<h3>${t}</h3><div class="grid">`+it.map(([k,v],i)=>{const ow=ownedP(v);return `<button class="card ${ow?'sel':''}" style="${rot(i)}" data-act="${cat}" data-v="${k}">${thumbFor(cat,k)}<span>${v.n}</span><b class="lk" style="${ow?'box-shadow:0 0 0 3px #9be3b6':''}">${ow?'✅ Senin':'💰 '+v.price}</b></button>`}).join('')+'</div>'};
 return `<div class="hint">💰 Altının: <b>${S.coins||0}</b> — Mini oyunlardan, defileden, müşterilerden ve günlük hediyeden altın kazan!</div>`
  +sec('👗 Kıyafetler','dress',DRESS)+sec('👠 Ayakkabılar','shoes',SHOES)+sec('👑 Takılar','acc',ACC)+sec('💇‍♀️ Saçlar','hair',HAIR)+sec('🐾 Dostlar','pet',PETS)+sec('🏞️ Mekanlar','bg',BGS)
  +`<h3>✨ Sticker Paketleri</h3><div class="toggles">`+Object.entries(PACKS).map(([k,v])=>(S.owned||[]).includes('pk:'+k)?`<div class="tog sel" style="text-align:center">${v.n} ✅<br><small>${v.e.slice(0,5).join('')}</small></div>`
   :`<button class="tog" data-act="pack" data-v="${k}">${v.n}<br><small>${v.e.slice(0,5).join('')}</small><br><b>💰 ${v.p}</b></button>`).join('')+'</div>'
  +shopHtml('n').replace('🛍️ Dükkân','💅 Tırnak Salonu')+shopHtml('c').replace('🛍️ Dükkân','🎂 Pasta Atölyesi')}

/* =====================  günlük hediye  ===================== */
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function openGift(){if(S.giftDay===today()){SND.no();toast('Bugünkü hediyeni aldın! Yarın yine gel ⏰',2200);return}

/* =====================  hafıza kartları  ===================== */
const MEMPOOL=['👗','👠','👑','💄','🎀','💎','👜','🦄','🌸','🍓','⭐','🧁','🐱','🌈','🦋','💅','🎂','🍭'];
let mem=null;
function memMenu(){$('#gTitle').textContent='🧠 Hafıza Kartları';gBody.innerHTML=`<div class="box" style="margin:auto"><div class="themebig">🧠</div><h2>Eşini Bul!</h2><p>Kartları çevir, aynı resimleri eşleştir. Ne kadar az hamle, o kadar çok altın! 💰</p>
 <div class="row"><button class="big alt" data-act="mstart" data-v="6">😊 Kolay</button><button class="big" data-act="mstart" data-v="8">😎 Orta</button><button class="big alt" data-act="mstart" data-v="10">🤯 Zor</button></div></div>`}
function memStart(n){const em=shuf(MEMPOOL).slice(0,n),deck=shuf([...em,...em]),cols=n===6?4:n===8?4:5,rows=deck.length/cols;
 mem={n,deck,open:[],done:new Set(),moves:0,lock:false};
 gBody.innerHTML=`<div class="content" style="flex:1;display:flex;flex-direction:column;align-items:center"><div class="memhud">👆 Hamle: <b id="mMoves">0</b> · ✅ Eşleşme: <b id="mPairs">0/${n}</b></div>
  <div class="memgrid" id="memGrid" style="grid-template-columns:repeat(${cols},1fr);--rows:${rows};--cols:${cols}">${deck.map((e,i)=>`<button class="mcard" data-act="mflip" data-v="${i}"><div class="in"><div class="f back">💖</div><div class="f front">${e}</div></div></button>`).join('')}</div></div>`}
function memFlip(i){const m=mem;if(!m||m.lock||m.done.has(i)||m.open.includes(i))return;const cs=$('#memGrid').children;cs[i].classList.add('open');m.open.push(i);tone(700,.06,'triangle',.1);
 if(m.open.length<2)return;m.moves++;$('#mMoves').textContent=m.moves;const [a,b]=m.open;
 if(m.deck[a]===m.deck[b]){m.done.add(a);m.done.add(b);m.open=[];setTimeout(()=>{cs[a].classList.add('done');cs[b].classList.add('done')},250);[880,1175].forEach((f,k)=>tone(f,.1,'triangle',.12,k*.08));
  $('#mPairs').textContent=`${m.done.size/2}/${m.n}`;if(m.done.size===m.deck.length)setTimeout(memWin,600)}
 else{m.lock=true;setTimeout(()=>{cs[a].classList.remove('open');cs[b].classList.remove('open');m.open=[];m.lock=false},850)}}
function memWin(){const m=mem,extra=m.moves-m.n,st=extra<=m.n*.5?3:extra<=m.n?2:1,coin=m.n+[0,0,m.n/2,m.n][st]|0;
 gameResult('🧠',`${STARS(st)}`,`${m.moves} hamlede bitirdin!`,coin,'mmenu');checkTasks('hafiza')}
function gameResult(emo,title,txt,coin,again){addCoins(coin);SND.star();confetti(30);
 gBody.insertAdjacentHTML('beforeend',`<div class="resWrap" style="border-radius:30px"><div class="result"><div class="themebig">${emo}</div><h2>${title}</h2><p>${txt}</p><p style="font-size:24px">+${coin} 💰</p>
  <div class="row"><button class="big alt" data-act="${again}">🔁 Tekrar</button><button class="big" data-act="gclose">Bitir 🎉</button></div></div></div>`)}

/* =====================  alışveriş yağmuru (yakala)  ===================== */
const GOOD=['👗','👠','👑','💄','🎀','👜','💅','🧁'],BONUS=['💎','⭐'];
let yk=null;
function ykMenu(){$('#gTitle').textContent='🛍️ Alışveriş Yağmuru';gBody.innerHTML=`<div class="box" style="margin:auto"><div class="themebig">🛍️</div><h2>Yağanları Yakala!</h2>
 <p>Parmağını kaydırarak çantayı oynat. 👗👠👑 = 1 puan · 💎⭐ = 3 puan</p><p>🌧️ bulutlarından kaç! 3 canın var ❤️❤️❤️</p><button class="big" data-act="ystart">Başla! 🚀</button></div>`}
function ykStart(){stopYk();gBody.innerHTML=`<div class="catch" id="catch"><div class="chud"><span id="ySc">⭐ 0</span><span id="yLv">❤️❤️❤️</span><span id="yTm">⏱️ 45</span></div><div class="bag" id="bag">🛍️</div></div>`;
 const box=$('#catch'),bag=$('#bag'),W=()=>box.clientWidth,H=()=>box.clientHeight;
 yk={items:[],score:0,lives:3,t:45,x:W()/2,tx:W()/2,last:performance.now(),spawn:0,run:true};
 const mv=e=>{const r=box.getBoundingClientRect();yk.tx=Math.max(30,Math.min(r.width-30,e.clientX-r.left))};box.addEventListener('pointerdown',mv);box.addEventListener('pointermove',mv);
 const loop=now=>{if(!yk||!yk.run)return;const dt=Math.min(.05,(now-yk.last)/1000);yk.last=now;yk.t-=dt;const k=H()/600,el=45-yk.t;
  yk.x+=(yk.tx-yk.x)*Math.min(1,dt*14);bag.style.transform=`translate3d(${yk.x-36}px,0,0)`;
  yk.spawn-=dt;if(yk.spawn<=0){yk.spawn=Math.max(.32,.9-el*.014);const r=Math.random(),e=r<.18?'🌧️':r<.3?rnd(BONUS):rnd(GOOD);const d=document.createElement('div');d.className='drop';d.textContent=e;box.appendChild(d);
   yk.items.push({d,e,x:30+Math.random()*(W()-60),y:-50,v:(150+el*4+Math.random()*60)*k})}
  const by=H()-70;
  for(const it of yk.items){it.y+=it.v*dt;it.d.style.transform=`translate3d(${it.x-22}px,${it.y}px,0)`;
   if(!it.gone&&it.y>by-30&&it.y<by+30&&Math.abs(it.x-yk.x)<52){it.gone=1;it.d.remove();
    if(it.e==='🌧️'){yk.lives--;tone(200,.2,'sawtooth',.08);box.classList.remove('hurt');void box.offsetWidth;box.classList.add('hurt')}
    else{const p=BONUS.includes(it.e)?3:1;yk.score+=p;tone(p>1?1320:880,.08,'triangle',.12);pop(box,it.x,by-30,'+'+p)}}
   if(!it.gone&&it.y>H()+10){it.gone=1;it.d.remove()}}
  yk.items=yk.items.filter(i=>!i.gone);
  $('#ySc').textContent='⭐ '+yk.score;$('#yLv').textContent='❤️'.repeat(Math.max(0,yk.lives))+'🤍'.repeat(3-Math.max(0,yk.lives));$('#yTm').textContent='⏱️ '+Math.max(0,Math.ceil(yk.t));
  if(yk.t<=0||yk.lives<=0){yk.run=false;const sc=yk.score,coin=Math.min(30,Math.max(2,Math.floor(sc/2)));
   gameResult(sc>=40?'🏆':'🛍️',`${sc} puan!`,yk.lives<=0?'Bulutlar seni yakaladı ama harikaydın!':'Süre doldu, süper topladın!',coin,'ystart');if(sc>=40)checkTasks('yakala40');return}
  requestAnimationFrame(loop)};
 requestAnimationFrame(loop)}
function stopYk(){if(yk)yk.run=false}
function pop(box,x,y,t){const d=document.createElement('div');d.className='hitpop';d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';box.appendChild(d);setTimeout(()=>d.remove(),700)}

/* =====================  dans (ritim)  ===================== */
const LANES=[['💖','#ff7ab5'],['⭐','#ffd23f'],['🎀','#a96cf5']];
let dn=null;
function dnMenu(){$('#gTitle').textContent='💃 Dans Partisi';gBody.innerHTML=`<div class="box" style="margin:auto"><div class="themebig">💃</div><h2>Ritmi Yakala!</h2>
 <p>Düşen şekiller çizgiye gelince altındaki butona bas! Arka arkaya bilirsen kombo yaparsın 🔥</p><div class="row"><button class="big alt" data-act="dnstart" data-v="96">🐢 Yavaş</button><button class="big" data-act="dnstart" data-v="118">🐇 Hızlı</button></div></div>`}
function dnStart(bpm){stopDn();audio();const beat=60/bpm,notes=[];
 for(let b=4;b<52;b++){if(Math.random()<.78)notes.push({t:b*beat,l:(Math.random()*3)|0});if(b>20&&Math.random()<.22)notes.push({t:(b+.5)*beat,l:(Math.random()*3)|0})}
 gBody.innerHTML=`<div class="dance"><div class="dstage"><svg viewBox="-170 -600 340 620" preserveAspectRatio="xMidYMid meet"><g id="dDoll"><g transform="translate(-150 -580)">${stk(doll(S))}</g></g></svg><div class="dhud"><b id="dSc">0</b><span id="dCb"></span></div><div id="dFb" class="dfb"></div></div>
  <div class="lanes" id="lanes">${LANES.map((l,i)=>`<div class="lane" style="--lc:${l[1]}"></div>`).join('')}<div class="hitline"></div>
  <div class="lbtns">${LANES.map((l,i)=>`<button class="lbtn" data-l="${i}" style="--lc:${l[1]}">${l[0]}</button>`).join('')}</div></div></div>`;
 const lanes=$('#lanes'),fall=1.7,melody=[523,587,659,784,880,784,659,587];
 dn={notes,score:0,combo:0,best:0,hit:0,t0:performance.now()/1000+.6,run:true,beat,end:52*beat+1.2};
 for(const n of notes){const d=document.createElement('div');d.className='note';d.textContent=LANES[n.l][0];d.style.left=`calc(${n.l*33.33}% + 16.66% - 26px)`;lanes.appendChild(d);n.d=d}
 for(let b=0;b<52;b++){tone(b%4===0?131:196,.12,'triangle',.07,.6+b*beat);if(b%2)tone(1800,.02,'square',.015,.6+b*beat)}
 notes.forEach((n,i)=>tone(melody[(i*3+n.l)%melody.length],.16,'sine',.06,.6+n.t));
 const press=l=>{if(!dn||!dn.run)return;const now=performance.now()/1000-dn.t0;let best=null,bd=9;
  for(const n of dn.notes)if(!n.done&&n.l===l){const d=Math.abs(n.t-now);if(d<bd){bd=d;best=n}}
  const b=lanes.querySelectorAll('.lbtn')[l];b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');
  if(best&&bd<.2){best.done=1;best.d.remove();const pf=bd<.09;dn.score+=pf?100:50;dn.combo++;dn.hit++;dn.best=Math.max(dn.best,dn.combo);fb(pf?'MÜKEMMEL! ✨':'İyi! 👍',pf);
   const dl=$('#dDoll');dl.classList.remove('dmove','dmove2');void dl.getBoundingClientRect();dl.classList.add(dn.combo%2?'dmove':'dmove2');if(dn.combo===30)checkTasks('combo30')}
  else{dn.combo=0;fb('Hop! 😅',false)}};
 lanes.querySelectorAll('.lbtn').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();press(+b.dataset.l)}));
 const loop=()=>{if(!dn||!dn.run)return;const now=performance.now()/1000-dn.t0,H=lanes.clientHeight,hy=H-110;
  for(const n of dn.notes){if(n.done)continue;const y=hy-(n.t-now)/fall*hy;n.d.style.transform=`translate3d(0,${y-26}px,0)`;n.d.style.opacity=y<-60?0:1;
   if(now-n.t>.22){n.done=1;n.d.classList.add('miss');setTimeout(()=>n.d.remove(),300);dn.combo=0}}
  $('#dSc').textContent=dn.score;$('#dCb').textContent=dn.combo>=3?`🔥 ${dn.combo} kombo`:'';
  if(now>dn.end){dn.run=false;const tot=dn.notes.length,r=dn.hit/tot,st=r>=.9?3:r>=.65?2:1,coin=Math.min(30,Math.round(dn.score/140)+2);
   gameResult('💃',STARS(st),`${dn.hit}/${tot} doğru · En iyi kombo: ${dn.best} 🔥`,coin,'dnmenu');return}
  requestAnimationFrame(loop)};requestAnimationFrame(loop)}
function fb(t,pf){const f=$('#dFb');if(!f)return;f.textContent=t;f.className='dfb show'+(pf?' pf':'');clearTimeout(fb.t);fb.t=setTimeout(()=>f.className='dfb',450)}
function stopDn(){if(dn)dn.run=false}
